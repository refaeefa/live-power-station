name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android-project/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        working-directory: android-project
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp android-project/app/build/outputs/apk/debug/app-debug.apk FahdSolarSaver.apk
      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "محطة الطاقة الحيّة — ملف أندرويد جاهز (APK)"
          body: "ملف التثبيت الجاهز لشاشات أندرويد / Google TV. يُبنى تلقائيًا. التثبيت: أعطِ رابط المستودع لوكيل الذكاء الاصطناعي."
          files: FahdSolarSaver.apk
          make_latest: true
